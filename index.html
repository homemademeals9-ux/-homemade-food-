async function loadPub(){const [m,s]=await Promise.all([sb.from('menu_items').select('*').order('sort'),sb.from('settings').select('*')]);menu=m.data||[];(s.data||[]).forEach(r=>cfg[r.key]=r.value);
 Object.keys(cart).forEach(id=>{const i=byId(id);if(!i||i.sold_out)delete cart[id]});keep()}

 return hdr()+`<section class="hero w"><div><h1>${tr('Домашняя халяльная еда<br>с любовью','Homemade halal food<br>made with love','Comida halal casera<br>hecha con amor')}</h1><div class="sc">Good Food · Happier People ♡</div><div class="chips"><span>🌿 ${tr('Свежие ингредиенты','Fresh ingredients','Ingredientes frescos')}</span><span>👨‍🍳 ${tr('Домашнее приготовление','Homemade','Hecho en casa')}</span><span>🚚 ${tr('Доставка','Delivery','Entrega')}</span></div><div class="gap"><a class="btn bg" href="#" data-a="gom">${tr('Смотреть меню','View menu','Ver el menú')} →</a><a class="btn bo" href="tel:${phd()}">📞 ${esc(cfg.phone)}</a></div></div><div class="himg">${hi?`<img src="${esc(hi)}" alt="">`:'🍲'}${HB}</div></section>
 <div class="tabs">${cs.map(c=>`<button class="tab ${c==cat?'on':''}" data-a="cat" data-c="${esc(c)}">${ci(c)} ${esc(cn(c))}</button>`).join('')}</div>
 <section class="w" id="menu"><h2 style="margin:8px 0 12px">${esc(cn(cat))}</h2><div class="grid">${menu.filter(i=>i.category==cat).map(card).join('')}</div></section>${ftr()}

let zc={};async function zll(z){if(zc[z])return zc[z];const r=await fetch('https://api.zippopotam.us/us/'+z);if(!r.ok)throw 0;const p=(await r.json()).places[0];return zc[z]=[+p.latitude,+p.longitude]}
async function calcMiles(){cust.miles=null;cust.zok=0;if(!/^\d{5}$/.test(cust.zip||''))return;try{const a=await zll(cfg.base_zip),b=await zll(cust.zip),r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;cust.miles=Math.round(7918*Math.asin(Math.sqrt(h))*1.25*10)/10;cust.zok=1}catch(e){cust.zok=-1}keep()}

function delivV(){const v=k=>esc(cfg[k]);return `<h1 style="font-size:32px">${ad('Доставка и время','Delivery & time')}</h1><div class="card"><h3>${ad('Зона доставки','Delivery zone')}</h3><label>${ad('Базовый ZIP-код (кухня)','Base ZIP (kitchen)')}</label><input id="d_zip" value="${v('base_zip')}"></div><div class="card"><h3>${ad('Правила доставки','Delivery rules')}</h3><label>${ad('Крупный заказ от ($)','Big order from ($)')}</label><input id="d_big" type="number" value="${v('big')}"><label>${ad('Бесплатно в пределах (миль) — меньшие заказы','Free miles — smaller orders')}</label><input id="d_fs" type="number" value="${v('free_small')}"><label>${ad('Бесплатно в пределах (миль) — крупные заказы','Free miles — big orders')}</label><input id="d_fb" type="number" value="${v('free_big')}"><label>${ad('Сверх лимита, $ за милю','Beyond the limit, $ per mile')}</label><input id="d_rate" type="number" step="0.01" value="${v('rate')}"></div><div class="card"><h3>${ad('Время доставки','Delivery times')}</h3><div class="ch">${TM.map(m=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="dt" value="${m}" style="width:auto" ${(cfg.times||[]).includes(m)?'checked':''}> ${m<60?m+' min':m/60+' h'}</label>`).join('')}</div><label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="d_ot" style="width:auto" ${cfg.other_time?'checked':''}> ${ad('Разрешить другое время','Allow other time')}</label></div><button class="btn" data-a="dsave">${ad('Сохранить настройки','Save settings')}</button>`}
async function storeV(){const [a,b]=await Promise.all([sb.from('admins').select('*'),sb.from('banned_phones').select('*')]),v=k=>esc(cfg[k]);
 return `<h1 style="font-size:32px">${ad('Витрина','Storefront')}</h1><div class="card"><label>${ad('Телефон','Phone')}</label><input id="s_ph" value="${v('phone')}"><label>WhatsApp (${ad('цифры','digits')})</label><input id="s_wa" value="${v('wa')}"><label>Instagram</label><input id="s_ig" placeholder="https://instagram.com/..." value="${v('ig')}"><label>Facebook</label><input id="s_fb" placeholder="https://facebook.com/..." value="${v('fb')}"><label class="btn bs bo" style="margin:8px 0;display:inline-block">📷 ${ad('Фото для главной','Home photo')}<input type="file" accept="image/*" id="shero" style="display:none"></label><br><button class="btn" data-a="ssave">${ad('Сохранить','Save')}</button></div>
 <div class="card"><h3>${ad('Админы','Admins')}</h3>${(a.data||[]).map(x=>`<div class="r" style="padding:4px 0"><span>${esc(x.email)}</span>${x.user_id==user.id?'':`<button class="btn bs bd" data-a="rma" data-id="${x.user_id}">✕</button>`}</div>`).join('')}<div class="gap"><input id="a_em" type="email" placeholder="email" style="flex:1"><button class="btn bs" data-a="addadm">${ad('Добавить админа','Add admin')}</button></div><p class="mu">${ad('Новый админ сначала создаёт аккаунт на странице входа, потом вы добавляете его email.','The new admin first creates an account on the sign-in page, then you add their email.')}</p></div>
 <div class="card"><h3>${ad('Заблокированные номера','Banned numbers')}</h3>${(b.data||[]).map(x=>`<div class="r" style="padding:4px 0"><span>${esc(x.phone)}</span><button class="btn bs bo" data-a="unban" data-id="${esc(x.phone)}">${ad('Разблокировать','Unban')}</button></div>`).join('')}<div class="gap"><input id="b_ph" type="tel" placeholder="(310) 555-0100" style="flex:1"><button class="btn bs bd" data-a="ban">${ad('Заблокировать','Ban')}</button></div></div>`}
async function saveSet(o){const {error}=await sb.rpc('admin_save_settings',{p_settings:o});if(error)throw error;Object.assign(cfg,o)}
async function adminRoute(){await adminInit();const h=location.hash.split('/'),p=h[1]||'orders';
 if(!user){app.innerHTML=loginV();return}if(!isA){app.innerHTML=noadmV();return}
 try{let b='';if(p=='orders'||p=='order'){await loadOrd();b=p=='order'?orderV(h[2]):ordersV()}else if(p=='menu')b=menuAV();else if(p=='edit')b=editV(h[2]);else if(p=='delivery')b=delivV();else if(p=='store')b=await storeV();
  app.innerHTML=shell(p=='order'?'orders':p=='edit'?'menu':p,b)}catch(e){app.innerHTML=shell(p,`<p class="er">${esc(e.message||e)}</p>`)}}
/* ---------- routing & events ---------- */
async function route(){clearTimeout(stT);const h=location.hash||'#';drawMod();window.scrollTo(0,0);
 if(h.startsWith('#admin'))return adminRoute();
 if(h=='#cart'){app.innerHTML=cartV();updSum();if(cartN()&&/^\d{5}$/.test(cust.zip||'')&&cust.zok==null)calcMiles().then(updSum);return}
 if(h=='#review'){const e=valid();if(!cartN()||e.length){location.hash='#cart';return}app.innerHTML=revV();return}
 if(h=='#done'){app.innerHTML=doneV();return}
 if(h=='#status'){app.innerHTML=await statusV();return}
 app.innerHTML=home();if(h=='#menu')$('#menu').scrollIntoView()}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,d=+t.dataset.d,v=t.dataset.v;
 if(a=='open')openMod(id);else if(a=='mclose'){if(e.target==t){mod=null;drawMod()}}
 else if(a=='mq'){mod.q=Math.max(1,Math.min(50,mod.q+d));drawMod()}
 else if(a=='madd'){cart[mod.id]={q:mod.q,note:mod.note};keep();mod=null;drawMod();route()}
 else if(a=='add'){cart[id]={q:((cart[id]||{}).q||0)+1,note:(cart[id]||{}).note||''};keep();toast('✔ '+tr('Добавлено','Added','Agregado'));route()}
 else if(a=='cat'){cat=t.dataset.c;route()}else if(a=='gom'){e.preventDefault();$('#menu').scrollIntoView({behavior:'smooth'})}
 else if(a=='cq'){cart[id].q=Math.max(1,cart[id].q+d);keep();route()}else if(a=='cdel'){e.preventDefault();delete cart[id];keep();route()}else if(a=='clr'){e.preventDefault();cart={};keep();route()}
 else if(a=='tm'){cust.tm=v=='o'?'o':+v;keep();route()}else if(a=='pay'){cust.pay=v;keep();route()}
 else if(a=='rev'){const er=valid();if(er.length){toast(tr('Заполните: ','Please fill in: ','Complete: ')+er.join(', '));return}location.hash='#review'}
 else if(a=='send')send();
 else if(a=='login'){const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});error?app.innerHTML=loginV(error.message):route()}
 else if(a=='signup'){e.preventDefault();const {error}=await sb.auth.signUp({email:$('#le').value.trim(),password:$('#lp').value});app.innerHTML=loginV(error?error.message:ad('Проверьте почту и подтвердите email, затем войдите.','Check your email to confirm, then sign in.'))}
 else if(a=='logout'){await sb.auth.signOut();user=null;isA=false;route()}
 else if(a=='of'){of=v;route()}else if(a=='oo')location.hash='#admin/order/'+id;
 else if(a=='ost'){const {error}=await sb.from('orders').update({status:v}).eq('id',id);if(error)toast(error.message);else{toast('✔');location.hash=v=='cancelled'||v=='completed'?'#admin/orders':'#admin/order/'+id;route()}}
 else if(a=='avail'){const i=byId(id);i.sold_out=!i.sold_out;try{await saveItems(menu);route()}catch(x){toast(x.message)}}
 else if(a=='et'){pullEd();et=+v;route()}else if(a=='eav'){pullEd();ed.sold_out=!ed.sold_out;route()}
 else if(a=='esave'){pullEd();if(!(ed.name||ed.name_ru||ed.name_es)){toast(ad('Введите название','Enter a name'));return}ed.name=ed.name||ed.name_ru||ed.name_es;const l=ed.id?menu.map(i=>i.id==ed.id?ed:i):[...menu,ed];try{await saveItems(l);ed=null;toast('✔');location.hash='#admin/menu'}catch(x){toast(x.message)}}
 else if(a=='edel'){if(!confirm(ad('Удалить блюдо?','Delete this dish?')))return;try{await saveItems(menu.filter(i=>i.id!=id));ed=null;location.hash='#admin/menu'}catch(x){toast(x.message)}}
 else if(a=='dsave'){try{await saveSet({base_zip:$('#d_zip').value.trim(),big:+$('#d_big').value,free_small:+$('#d_fs').value,free_big:+$('#d_fb').value,rate:+$('#d_rate').value,times:[...document.querySelectorAll('.dt:checked')].map(x=>+x.value),other_time:$('#d_ot').checked});toast('✔ '+ad('Сохранено','Saved'))}catch(x){toast(x.message)}}
 else if(a=='ssave'){try{await saveSet({phone:$('#s_ph').value.trim(),wa:$('#s_wa').value.replace(/\D/g,''),ig:$('#s_ig').value.trim(),fb:$('#s_fb').value.trim()});toast('✔ '+ad('Сохранено','Saved'))}catch(x){toast(x.message)}}
 else if(a=='addadm'){const {data,error}=await sb.rpc('add_admin',{p_email:$('#a_em').value});toast(error?error.message:data.ok?'✔':ad('Пользователь не найден: пусть сначала создаст аккаунт','User not found: they must create an account first'));route()}
 else if(a=='rma'){await sb.rpc('remove_admin',{p_user:id});route()}
 else if(a=='ban'){let p=$('#b_ph').value.replace(/\D/g,'');if(p.length==11&&p[0]=='1')p=p.slice(1);if(p.length>=10){await sb.from('banned_phones').insert({phone:p});route()}}
 else if(a=='unban'){await sb.from('banned_phones').delete().eq('phone',id);route()}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;
 if(t.id=='oq'){oq=t.value;const p=t.selectionStart;route().then(()=>{const n=$('#oq');n&&(n.focus(),n.setSelectionRange(p,p))})}
 else if(t.id=='mq'){mq=t.value;const p=t.selectionStart;route().then(()=>{const n=$('#mq');n&&(n.focus(),n.setSelectionRange(p,p))})}
 else if(f=='mnote')mod.note=t.value;else if(f=='cnote'){cart[t.dataset.id].note=t.value;keep()}
 else if(['name','phone','street','apt','city','zip','instr','td','th'].includes(f)){cust[f]=t.value;if(f=='zip'){cust.zok=null;cust.miles=null;if(/^\d{5}$/.test(t.value))calcMiles().then(updSum);else updSum()}keep();if(f!='zip')updSum()}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.f=='lang'){L=+t.value;localStorage.setItem('L',L);route()}else if(t.id=='mc'){mc=t.value;route()}
 else if(t.id=='fimg'&&t.files[0]){pullEd();try{ed.image_url=await upImg(t.files[0]);route()}catch(x){toast(x.message)}}
 else if(t.id=='shero'&&t.files[0]){try{await saveSet({hero:await upImg(t.files[0])});toast('✔')}catch(x){toast(x.message)}}});
addEventListener('hashchange',route);
loadPub().then(route).catch(()=>{app.innerHTML='<div class="cen card">Connection error. Please reload.</div>'});
</script></body></html>
