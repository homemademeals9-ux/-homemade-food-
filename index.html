"вы", "Remove": "Удалить", "Add admin": "Добавить админа", "Phone number (their login)": "Номер телефона (логин)", "Banned phone numbers": "Заблокированные номера", "No one banned.": "Никто не заблокирован.", "Unban": "Разблокировать", "Ban a number": "Заблокировать номер", "Phone number": "Номер телефона", "Ban": "Заблокировать", "Unsaved changes": "Есть несохранённые изменения", "All saved": "Всё сохранено", "Save & Publish": "Сохранить и опубликовать", "Published.": "Опубликовано.", "Could not publish. Open this page while signed in to claude.ai as its owner, then save again.": "Не удалось опубликовать. Откройте страницу, войдя в claude.ai как владелец, и сохраните снова.", "Could not read that photo.": "Не удалось прочитать фото.", "That admin already exists.": "Такой админ уже есть."};
function tr(el){if(lang!='ru')return;const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const k=n.nodeValue.trim();if(AR[k])n.nodeValue=n.nodeValue.replace(k,AR[k])}el.querySelectorAll('[placeholder]').forEach(i=>{if(AR[i.placeholder])i.placeholder=AR[i.placeholder]})}
const LB=()=>`<div class="tabs" style="margin:0">`+['en','ru'].map(x=>`<button class="${lang==x?'':'b2'}" data-a="lang" data-v="${x}">${x=='en'?'EN':'РУ'}</button>`).join('')+`</div>`;
let note='',pt={m:'asap',t:''},mode='delivery';
const sub=()=>S.items.reduce((a,i,k)=>a+(i.x?0:(cart[k]||0))*i.p,0);
const freeMi=()=>sub()>=S.big?S.freeB:S.freeS;
const fee=()=>pl&&pl.mi!=null?Math.max(0,Math.ceil(pl.mi-freeMi()))*S.rate:0;
const pickT=()=>pt.m=='time'?(L('ptime')+': '+(pt.t||'-')):L(pt.m=='asap'?'asap':'p'+pt.m);
function waTxt(){let t=0,ls=[];S.items.forEach((i,k)=>{const q=i.x?0:(cart[k]||0);if(q){t+=q*i.p;ls.push(`${q}x ${bn(i)} (${money(q*i.p)})`)}});const f=fee();return `${L('msg')} ${cu?cu.name:''} (${cu?cu.phone:''}):\n${ls.join('\n')}\n${L('loc')}: ${pl?pl.n+(pl.m!=null?` (~${pl.m} ${L('min')})`:''):'-'}\n${L('feeL')}: ${money(f)}\n${L('tot')}: ${money(t+f)}\n${L('time')}: ${pickT()}\n${L('note')}: ${note||'-'}`}
function extraV(){return `<div class="card"><b>${L('time')}</b><select data-f="pt">`+[['asap','asap'],['30','p30'],['60','p60'],['120','p120'],['time','ptime']].map(([v,k])=>`<option value="${v}" ${pt.m==v?'selected':''}>${L(k)}</option>`).join('')+`</select>`+(pt.m=='time'?`<input type="time" data-f="ptt" value="${esc(pt.t)}">`:'')+`<b>${L('note')}</b><input data-f="note" placeholder="${L('notep')}" value="${esc(note)}"></div>`}
function head(){return `<div class="r" style="flex-wrap:wrap"><h1>🍽️ ${L('ttl')}</h1><div class="tabs" style="margin:0">${['en','ru','es'].map(x=>`<button class="${lang==x?'':'b2'}" data-a="lang" data-v="${x}">${x=='en'?'EN':x=='ru'?'РУ':'ES'}</button>`).join('')}</div></div><div class="mu">${L('tag')}</div>${location.hash=='#admin'?'':tabs()}`}
function foot(){return `<p style="margin-top:30px"><a class="l" href="#admin">Admin</a></p>`}
function render(){
 if(location.hash=='#admin'){app.innerHTML=adm?adminV():loginV();tr(app);return}
 if(cu&&isBan(cu.phone)){app.innerHTML=head()+`<div class="card er">${L('ban')}</div>`+foot();return}
 if(view=='orders')return void(app.innerHTML=head()+ordersV()+foot());
 if(view=='comm')return void(app.innerHTML=head()+commV()+foot());
 if(view=='follow')return void(app.innerHTML=head()+followV()+foot());
 if(view=='menu')return void(app.innerHTML=menuV());
 if(view=='gate')return void(app.innerHTML=head()+`<div class="card"><h2 style="margin-top:0">${L('bf')}</h2><p class="mu">${Object.values(cart).some(q=>q>0)?L('gateC'):L('bfp')}</p><form data-f="gate"><input name="n" placeholder="${L('yn')}" required autocomplete="name"><input name="p" type="tel" placeholder="${L('ph')}" required autocomplete="tel"><div class="er">${msg}</div><button>${L('see')}</button></form></div>`+foot());
 app.innerHTML=head()+`<div class="card"><p>${L('intro')}</p><button data-a="order">${L('ord')}</button></div><p class="mu">${L('q')} <a href="https://wa.me/${S.wa}">(310) 569-8903</a></p>`+foot();
}
function menuV(){
 const cats=[...new Set(S.items.map(i=>i.c))];let t=0,lines=[];
 let h=head()+(cu?`<p class="mu">${L('hi')} ${esc(cu.name)} — <a class="l" href="#" data-a="out">${L('no')}</a></p>`:'')+`${hist().length?`<p><button class="b2" data-a="again" data-k="0">${L('again')}</button></p>`:''}`;
 h+=locV()+extraV();cats.forEach(c=>{h+=`<h2>${esc(c)}${CR[c]?' / '+esc(CR[c]):''}${lang=='es'&&CS[c]?' / '+esc(CS[c]):''}</h2>`;S.items.forEach((i,k)=>{if(i.c!=c)return;const q=i.x?0:(cart[k]||0);if(q){t+=q*i.p;lines.push(`${q}x ${bn(i)} (${money(q*i.p)})`)}
  h+=`<div class="card r"><div><b>${esc(i.n)}</b>${rn(i)?`<div class="mu">${esc(rn(i))}</div>`:''}${lang=='es'&&sn(i)?`<div class="mu">${esc(sn(i))}</div>`:''}<div class="mu">${money(i.p)}</div></div>${i.x?`<span class="er">${L('sold')}</span>`:`<div class="q"><button class="b2" data-a="m" data-k="${k}">−</button><b>${q}</b><button data-a="p" data-k="${k}">+</button></div>`}</div>`})});
 const txt=waTxt();
 return h+foot()+`<div class="bar"><b>${L('tot')} ${money(t+fee())}</b>${lines.length&&!cu?`<button data-a="checkout">${L('checkout')}</button>`:lines.length&&pl&&pl.n?`<a class="b" data-a="send" target="_blank" rel="noopener" href="https://wa.me/${S.wa}?text=${encodeURIComponent(txt)}">${L('send')}</a>`:`<span class="mu">${lines.length?L('needloc'):L('add')}</span>`}</div>`;
}
function loginV(){return head()+`<div class="card"><h2 style="margin-top:0">Admin sign in</h2><form data-f="login"><input name="u" placeholder="Phone number or username" autocapitalize="none" required><input name="p" type="password" placeholder="Password" required><div class="er">${msg}</div><button>Sign in</button></form></div><p><a class="l" href="#" data-a="home">← Back to site</a></p>`}
function adminV(){
 let h=`<div class="r" style="flex-wrap:wrap"><h1>Admin</h1>${LB()}<button class="b2" data-a="logout">Sign out</button></div><p class="mu"><span>Signed in as</span> ${esc(adm)}<span>. Edit, then press Save &amp; Publish.</span></p><div class="er">${msg}</div>`;
 h+=`<h2>Menu items</h2><div class="ov">`+S.items.map((i,k)=>`<div class="g"><input data-k="${k}" data-f="n" value="${esc(i.n)}"><input data-k="${k}" data-f="c" value="${esc(i.c)}"><input data-k="${k}" data-f="p" type="number" step="0.01" min="0" value="${i.p}"><label class="mu"><input type="checkbox" style="width:auto" data-k="${k}" data-f="x" ${i.x?'checked':''}> Sold out</label><button class="dg" data-a="del" data-k="${k}">✕</button></div>`).join('')+`</div>`;
 h+=`<form data-f="add" class="card"><b>Add item</b><input name="n" placeholder="Item name" required><input name="r" placeholder="Russian name (optional)"><input name="s" placeholder="Spanish name (optional)"><input name="c" placeholder="Category (e.g. Soups)" required><input name="p" type="number" step="0.01" min="0" placeholder="Price" required><button>Add item</button></form>`;
 h+=adminPh()+adminLoc()+`<h2>Admins</h2>`+S.admins.map((a,k)=>`<div class="card r"><span>${esc(a.u)}</span>${a.u==adm?'<span class="mu">you</span>':`<button class="dg" data-a="deladm" data-k="${k}">Remove</button>`}</div>`).join('')+`<form data-f="addadm" class="card"><b>Add admin</b><input name="u" placeholder="Phone number (their login)" autocapitalize="none" required><input name="p" type="password" placeholder="Password" required><button>Add admin</button></form>`;
 h+=`<h2>Banned phone numbers</h2>`+(S.banned.map((b,k)=>`<div class="card r"><span>${esc(b)}</span><button class="b2" data-a="unban" data-k="${k}">Unban</button></div>`).join('')||'<p class="mu">No one banned.</p>')+`<form data-f="ban" class="card"><b>Ban a number</b><input name="p" type="tel" placeholder="Phone number" required><button class="dg">Ban</button></form>`;
 return h+`<div class="bar"><span class="mu">${dirty?'Unsaved changes':'All saved'}</span><button data-a="save">Save &amp; Publish</button></div><p><a class="l" href="#" data-a="home">← Back to site</a></p>`}
async function save(){
 try{const a=window.claude?await claude.use('artifact'):null;if(!a)throw 0;
  const d=document.documentElement.cloneNode(true);d.querySelector('#st').textContent=JSON.stringify(S).replace(/</g,'\\u003c');d.querySelector('#app').innerHTML='';
  await a.publish('<!doctype html>\n'+d.outerHTML);dirty=false;msg='Published.'}
 catch(e){msg='Could not publish. Open this page while signed in to claude.ai as its owner, then save again.'}
 render()}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,k=+t.dataset.k;
 if(a=='order'){view='menu';render()}
 else if(a=='lang'){lang=t.dataset.v;localStorage.setItem('lang',lang);render()}
 else if(a=='tab'){const v=t.dataset.v;view=v=='order'?'menu':v;render()}
 else if(a=='delph'){S.photos.splice(k,1);dirty=true;render()}
 else if(a=='explore'){view='menu';render()}
 else if(a=='checkout'){view='gate';render()}
 else if(a=='goadmin'){location.hash='#admin'}
 else if(a=='send'){t.href='https://wa.me/'+S.wa+'?text='+encodeURIComponent(waTxt());saveOrder()}
 else if(a=='again'){const o=hist()[k];cart={};(o?o.i:[]).forEach(x=>{const j=S.items.findIndex(y=>y.n==x.n);if(j>=0&&!S.items[j].x)cart[j]=x.q});view='menu';render()}
 else if(a=='geo'){gmsg='';if(!navigator.geolocation){gmsg=L('gerr');return render()}navigator.geolocation.getCurrentPosition(g=>{const r=Math.PI/180,la=g.coords.latitude,lo=g.coords.longitude,dl=(la-34.0633)*r,dn=(lo+117.6509)*r,h2=Math.sin(dl/2)**2+Math.cos(la*r)*Math.cos(34.0633*r)*Math.sin(dn/2)**2,km=12742*Math.asin(Math.sqrt(h2));pl={n:L('my'),m:Math.max(5,Math.round(km*1.3/70*12)*5),mi:Math.round(km*.621*1.3)};savePl();gmsg='';render()},()=>{gmsg=L('gerr');render()},{timeout:8000})}
 else if(a=='delloc'){S.locs.splice(k,1);dirty=true;render()}
 else if(a=='p'){cart[k]=(cart[k]||0)+1;render()}
 else if(a=='m'){cart[k]=Math.max(0,(cart[k]||0)-1);render()}
 else if(a=='out'){e.preventDefault();localStorage.removeItem('cu');cu=null;cart={};view='menu';render()}
 else if(a=='home'){e.preventDefault();location.hash='';view='home';render()}
 else if(a=='logout'){sessionStorage.removeItem('adm');adm=null;msg='';render()}
 else if(a=='del'){S.items.splice(k,1);dirty=true;render()}
 else if(a=='deladm'){S.admins.splice(k,1);dirty=true;render()}
 else if(a=='unban'){S.banned.splice(k,1);dirty=true;render()}
 else if(a=='save')save()});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f,k=t.dataset.k;if(k==null)return;S.items[k][f]=f=='p'?(+t.value||0):f=='x'?t.checked:t.value;dirty=true;msg='';render()});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.dataset.f,v=Object.fromEntries(new FormData(e.target));msg='';
 if(f=='gate'){const p=dig(v.p);if(p.length<10){msg=L('bad');return render()}
  if(isBan(p)){cu={name:v.n,phone:p};return render()}
  cu={name:v.n.trim(),phone:p};localStorage.setItem('cu',JSON.stringify(cu));view='menu';render()}
 else if(f=='login'){const h=await sha(v.p);if(S.admins.some(a=>a.u==norm(v.u)&&a.h==h)){adm=norm(v.u);sessionStorage.setItem('adm',adm)}else msg='Wrong username or password.';render()}
 else if(f=='add'){S.items.push({n:v.n,r:(v.r||'').trim(),s:(v.s||'').trim(),c:v.c.trim(),p:+v.p});dirty=true;render()}
 else if(f=='addadm'){const u=norm(v.u);if(S.admins.some(a=>a.u==u))msg='That admin already exists.';else{S.admins.push({u,h:await sha(v.p)});dirty=true}render()}
 else if(f=='addloc'){S.locs.push({n:v.n.trim(),m:+v.m,mi:+v.mi});dirty=true;render()}
 else if(f=='ban'){const p=dig(v.p);if(p&&!S.banned.includes(p)){S.banned.push(p);dirty=true}render()}});
document.addEventListener('change',async e=>{const t=e.target,f=t.dataset.f;
 if(f=='loc'){pl=t.value===''?null:t.value=='o'?{n:'',m:null,o:1}:{n:S.locs[t.value].n,m:+S.locs[t.value].m,mi:+S.locs[t.value].mi};savePl();return render()}
 if(f=='oth'){pl={n:t.value.trim(),m:null,o:1};savePl();return}
 if(t.dataset.lk!=null){const l=S.locs[t.dataset.lk],g=t.dataset.lf;l[g]=(g=='m'||g=='mi')?(+t.value||0):t.value;dirty=true;return}
 if(f=='mode'){mode=t.value;return render()}
 if(f=='pt'){pt.m=t.value;return render()}
 if(f=='ptt'){pt.t=t.value;return}
 if(f=='note'){note=t.value.trim();return}
 if(f=='big'||f=='freeS'||f=='freeB'){S[f]=+t.value||0;dirty=true;return}
 if(f=='free'){S.free=+t.value||0;dirty=true;return}
 if(f=='rate'){S.rate=+t.value||0;dirty=true;return}
 if(f=='addr'){S.addr=t.value.trim();dirty=true;return}
 if(f=='lim'){S.lim=+t.value||60;dirty=true;return}
 if(f=='fb'||f=='ig'){S[f]=t.value.trim();dirty=true;return}
 if(f!='file'||!t.files[0])return;const im=new Image();im.src=URL.createObjectURL(t.files[0]);try{await im.decode()}catch(x){msg='Could not read that photo.';return render()}
 const sc=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 S.photos.unshift({d:c.toDataURL('image/jpeg',.72),c:($('#cap')||{}).value||''});dirty=true;render()});
S.locs.forEach(l=>{if(l.mi==null)l.mi=Math.round(l.m*.75)});
addEventListener('hashchange',render);render();
